
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">

  <title>Hasil Laporan - Jurnal PKL</title>

  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="result-container">

    <div class="result-icon" id="resultIcon">✓</div>

    <h1 id="resultTitle">Memeriksa laporan...</h1>

    <p id="resultMessage">
      Mohon tunggu sebentar.
    </p>

    <section class="result-details">
      <h2>Detail Laporan</h2>
      <div id="reportDetails"></div>
    </section>

    <a href="./index.html" class="back-button">
      Kembali ke Formulir
    </a>

  </main>

  <script>
    const icon = document.getElementById("resultIcon");
    const title = document.getElementById("resultTitle");
    const message = document.getElementById("resultMessage");
    const details = document.getElementById("reportDetails");

    let report = null;

    try {
      report = JSON.parse(
        sessionStorage.getItem("jurnalHasil") || "null"
      );
    } catch (error) {
      report = null;
    }

    const status = sessionStorage.getItem("jurnalStatus");
    const messageText = sessionStorage.getItem("jurnalPesan");

    // STATUS LAPORAN
    if (status === "success") {

      icon.textContent = "✓";
      title.textContent = "Laporan berhasil dikirim";
      message.textContent =
        messageText || "Laporan berhasil disimpan.";

    } else if (status === "error") {

      icon.textContent = "!";
      icon.classList.add("error");
      title.textContent = "Laporan gagal dikirim";
      message.textContent =
        messageText || "Laporan gagal disimpan.";
      message.style.color = "#f87171";

    } else {

      icon.textContent = "?";
      icon.classList.add("error");
      title.textContent = "Status belum dipastikan";
      message.textContent =
        messageText ||
        "Periksa Google Sheets sebelum mencoba mengirim ulang.";
    }

    // DETAIL LAPORAN
    if (report) {

      const fields = [
        ["Tanggal", report.tanggal],
        ["Nama", report.nama],
        ["Kelas", report.kelas],
        ["Pembimbing", report.pembimbing],
        ["Perusahaan", report.perusahaan],
        ["Kegiatan", report.kegiatan]
      ];

      fields.forEach(([label, value]) => {

        const item = document.createElement("div");
        item.className = "detail-item";

        const name = document.createElement("span");
        name.textContent = label;

        const content = document.createElement("strong");
        content.textContent = value || "-";

        item.appendChild(name);
        item.appendChild(content);

        details.appendChild(item);

      });

      // FOTO DOKUMENTASI
      if (report.foto) {

        const photoTitle = document.createElement("h3");
        photoTitle.textContent = "Dokumentasi";
        photoTitle.style.color = "var(--text)";
        photoTitle.style.marginTop = "18px";

        const image = document.createElement("img");
        image.src = report.foto;
        image.alt = "Dokumentasi kegiatan PKL";
        image.className = "result-photo";

        details.appendChild(photoTitle);
        details.appendChild(image);

      }

    } else {

      details.textContent =
        "Data laporan belum tersedia.";

    }
  </script>

</body>
</html>
